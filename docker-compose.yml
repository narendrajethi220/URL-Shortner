version: '3.8'   # Docker Compose File Format

services:
   app:
     build: .
     container_name: url-shortener-app
     env_file: 
        - .env.production
     ports:
        - "7777:7777"
     depends_on:
        - redis
     healthcheck:
         test: ["CMD","wget","-qO-","http://localhost:7777/api/v1/ping"]
         interval: 30s
         timeout: 10s
         retries: 3
     networks:
        - app-network
  
   redis:
       image: redis:alpine
       container_name: shortener-redis
       ports:
         - "6379:6379"
       volumes:
         - redis-data:/data
       networks:
         - app-network

volumes:
  redis-data:

networks:
    app-network:
       driver: bridge   
